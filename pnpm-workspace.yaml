# Single-package repo: this file only holds pnpm settings (no `packages:` list).
#
# Dependencies allowed to run install/build scripts (pnpm blocks them by
# default): `workerd` is MiniOxygen's runtime, `esbuild` is Vite 8's optional
# peer (its postinstall picks the platform binary), `unrs-resolver` is pulled in
# by eslint-import-resolver-typescript, `core-js` by posthog-js.
allowBuilds:
  core-js: true
  esbuild: true
  unrs-resolver: true
  workerd: true
