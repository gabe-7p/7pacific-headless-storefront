# Single-package repo: this file exists only to hold pnpm settings (their home
# in pnpm v10+). No `packages:` list — this is not a monorepo.
#
# Allow these dependencies to run their install/build scripts. pnpm blocks
# build scripts by default. `workerd` is MiniOxygen's runtime, `esbuild` is
# Vite 8's optional peer (its postinstall picks the platform binary),
# `unrs-resolver` is pulled in by eslint-import-resolver-typescript, and
# `core-js` by posthog-js. `allowBuilds` is the pnpm 11 setting (a
# package→boolean map); an entry set to `false` would explicitly BLOCK that
# package's scripts.
allowBuilds:
  core-js: true
  esbuild: true
  unrs-resolver: true
  workerd: true
#
# Patched packages (`pnpm patch`). `@react-router/dev` 7.16 passes `envFile: false`
# to Vite, which Vite 8.1+ deprecated — every `pnpm dev` printed the warning six
# times. This is a backport of the upstream fix (remix-run/react-router#15230,
# shipped only in @react-router/dev 8.1.0; no 7.x release carries it). Delete the
# patch and this entry when the repo moves to React Router 8.
patchedDependencies:
  '@react-router/dev@7.16.0': patches/@react-router__dev@7.16.0.patch
